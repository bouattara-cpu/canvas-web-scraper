<!DOCTYPE html>
<html>
<head>
  <title>Canvas Assignments</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .active { border-left: 5px solid green; }
    .past { border-left: 5px solid gray; }
    button { margin-right: 5px; padding: 5px 10px; }
  </style>
</head>
<body>

<h1>Canvas Assignments</h1>

<input type="file" id="fileInput" accept=".json">
<br><br>

<button id="allBtn">All</button>
<button id="activeBtn">Active</button>
<button id="pastBtn">Past</button>
<button id="downloadBtn">Download JSON</button>

<div id="output"></div>

<script>
let assignments = [];
let currentFilter = 'all';

// Load the JSON file the student picks
$('#fileInput').change(function (event) {
  const file = event.target.files[0];
  const reader = new FileReader();
  reader.onload = function (e) {
    assignments = JSON.parse(e.target.result);
    showAssignments();
  };
  reader.readAsText(file);
});

// Draw the cards on the page based on the current filter
function showAssignments() {
  $('#output').empty();

  let filtered = assignments;
  if (currentFilter === 'active') {
    filtered = assignments.filter(a => a.timeline === 'active');
  } else if (currentFilter === 'past') {
    filtered = assignments.filter(a => a.timeline === 'past');
  }

  filtered.forEach(function (a) {
    const card = $('<div class="card"></div>');
    card.addClass(a.timeline);
    card.append('<h3>' + a.title + '</h3>');
    card.append('<p>Due: ' + a.dueDate + '</p>');
    card.append('<p>Status: ' + a.status + '</p>');
    card.append('<p>Points: ' + a.points + '</p>');
    card.append('<p>' + a.description + '</p>');
    $('#output').append(card);
  });
}

$('#allBtn').click(function () {
  currentFilter = 'all';
  showAssignments();
});

$('#activeBtn').click(function () {
  currentFilter = 'active';
  showAssignments();
});

$('#pastBtn').click(function () {
  currentFilter = 'past';
  showAssignments();
});

// Bonus: download whatever is currently loaded as a JSON snapshot
$('#downloadBtn').click(function () {
  const dataStr = JSON.stringify(assignments, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'assignments_snapshot.json';
  link.click();
});
</script>

</body>
</html>
