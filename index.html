<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALU Canvas - Assignments Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <h2>ALU</h2>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-book"></i><span>Courses</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-inbox"></i><span>Inbox</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Frontend Web Development - Assignments</h1>
            <button id="load-data-btn" class="btn-primary">
                <i class="fa-solid fa-rotate"></i> Load Assignments
            </button>
        </header>

        <div class="dashboard-container">
            <!-- Assignments Grid Section -->
            <section class="assignments-section">
                <h2>Assignment List</h2>
                <div id="assignments-grid" class="grid">
                    <p class="placeholder-text">Click "Load Assignments" to display the scraped data.</p>
                </div>
            </section>

            
            <aside class="todo-aside">
                <h3>To Do</h3>
                <div class="todo-card">
                    <p class="todo-title">Web Scraper Activity</p>
                    <span class="todo-date">Due Today at 11:59pm</span>
                </div>
                <div class="todo-card">
                    <p class="todo-title">Frontend Quiz Preparation</p>
                    <span class="todo-date">Tomorrow morning</span>
                </div>
            </aside>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
